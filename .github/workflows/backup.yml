name: TRIAD automatic backup
on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Create backup on Render
        env:
          BACKUP_TOKEN: ${{ secrets.TRIAD_BACKUP_TOKEN }}
        run: |
          echo "Contactando con TRIAD STUDIO..."
          curl --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 180 \
            -X POST \
            -H "X-Backup-Token: ${BACKUP_TOKEN}" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            https://triad-studio.onrender.com/api/backup
